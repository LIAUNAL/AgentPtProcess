name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only what the pages use: the three decks, CSS, JS and the
      # images and video they reference. /atenea/ is a copy of index.html with
      # <base href="../"> so relative asset paths resolve from the site root.
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site/atenea
          cp index.html kickoff.html e1-e4.html .nojekyll _site/
          cp -R assets/css assets/js _site/
          mkdir -p _site/assets && mv _site/css _site/js _site/assets/
          grep -ohE '(src|href)="assets/(images|videos)/[^"?#]+' index.html kickoff.html e1-e4.html \
            | sed -E 's/^(src|href)="//' | sort -u | while read -r f; do
              mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done
          sed 's#<head>#<head>\n    <base href="../" />#' index.html > _site/atenea/index.html
          grep -q '<base href="../" />' _site/atenea/index.html
      - name: Check local links
        run: |
          set -euo pipefail
          missing=0
          for f in $(grep -ohE '(src|href)="assets/[^"?#]+' _site/*.html | sed -E 's/^(src|href)="//' | sort -u); do
            [ -e "_site/$f" ] || { echo "missing: $f"; missing=1; }
          done
          du -sh _site
          exit $missing
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
