name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # /atenea/ publica el mismo deck: copia de index.html con <base href="../">
      # para que las rutas relativas (assets/...) resuelvan desde la raíz.
      - name: Build /atenea/ alias
        run: |
          mkdir -p atenea
          sed 's#<head>#<head>\n    <base href="../" />#' index.html > atenea/index.html
          grep -q '<base href="../" />' atenea/index.html
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
